services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: insurecrm
      POSTGRES_USER: insurecrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insurecrm -d insurecrm"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    volumes:
      - object-data:/data

  minio-bootstrap:
    image: minio/mc:latest
    depends_on:
      minio: {condition: service_started}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do sleep 2; done;
        mc mb --ignore-existing local/insurecrm-documents;
        mc anonymous set none local/insurecrm-documents
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav

  web:
    build: .
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://insurecrm:${POSTGRES_PASSWORD}@postgres:5432/insurecrm
      IDENTITY_STORE_PATH: /data/identity/crm_identity.json
      DOCUMENT_ROOT: /data/documents
      BACKUP_ROOT: /data/backups
      OBJECT_STORAGE_BUCKET: insurecrm-documents
      OBJECT_STORAGE_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      CLAMAV_HOST: clamav
      ENABLE_REMINDER_SCHEDULER: "0"
    ports:
      - "8080:8080"
    volumes:
      - identity-data:/data/identity
      - backup-data:/data/backups
    depends_on:
      postgres: {condition: service_healthy}
      minio-bootstrap: {condition: service_completed_successfully}
      clamav: {condition: service_started}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 5

  worker:
    build: .
    command: ["python", "crm_worker.py"]
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://insurecrm:${POSTGRES_PASSWORD}@postgres:5432/insurecrm
      IDENTITY_STORE_PATH: /data/identity/crm_identity.json
      SCHEDULER_PROCESS: "1"
      ENABLE_REMINDER_SCHEDULER: "0"
    volumes:
      - identity-data:/data/identity
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

  backup:
    image: postgres:17-alpine
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        while true; do
          pg_dump -Fc -h postgres -U insurecrm -d insurecrm -f /backups/insurecrm-$$(date -u +%Y%m%dT%H%M%SZ).dump;
          find /backups -type f -name 'insurecrm-*.dump' -mtime +$${BACKUP_RETENTION_DAYS:-30} -delete;
          sleep 86400;
        done
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-30}
    volumes:
      - backup-data:/backups
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  postgres-data:
  object-data:
  clamav-data:
  identity-data:
  backup-data:
